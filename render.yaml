# Render.com blueprint: deploy the API + portal with one click.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: texas-isd-finances
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_DB_URL
        sync: false # set in the Render dashboard
      - key: OPENAI_API_KEY
        sync: false # set in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.3
