<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Texas ISD report</title>
  <style>
/*__TXISD_DESIGN_CSS__*/
body { padding: 16px; }
.mcp-report { max-width: 900px; }
.mcp-bars { display: grid; gap: 16px; margin: 16px 0; }
.mcp-bar-group { display: grid; gap: 8px; }
.mcp-bar-label { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
.mcp-bar-track { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.mcp-bar { height: 100%; background: var(--accent); }
  </style>
</head>
<body>
  <main class="mcp-report" aria-live="polite">
    <h1>Texas ISD finance report</h1>
    <p id="status" role="status">Waiting for public report data.</p>
    <section id="report" aria-label="Public finance figures"></section>
    <p><a id="website" href="https://txisd.dev/" target="_blank" rel="noopener">Open Texas ISD Finances</a></p>
  </main>
  <script>/*__TXISD_VISUAL_COMPONENTS__*/</script>
  <script>
(() => {
  'use strict';
  let nextId = 0, rendered = false;
  const pending = new Map();
  const status = document.querySelector('#status');
  const report = document.querySelector('#report');
  const website = document.querySelector('#website');
  const display = value => value == null ? 'Not available' : typeof value === 'number'
    ? value.toLocaleString(undefined, { maximumFractionDigits: 1 }) : String(value);
  const safeUrl = value => { try {
    const url = new URL(value); return url.protocol === 'https:' && url.hostname === 'txisd.dev' ? url.href : null;
  } catch (_) { return null; } };
  const notify = (method, params) => parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
  function request(method, params) {
    const id = ++nextId;
    parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => { pending.delete(id); reject(new Error('The host did not respond in time.')); }, 8000);
      pending.set(id, { resolve, reject, timeout });
    });
  }
  function metricRows(visual) {
    if (visual.view !== 'comparison') return visual.metrics;
    return visual.metrics.flatMap(row => (row.values || []).map(metric => Object.assign({}, metric, {
      label: row.district_name + ': ' + metric.label,
    })));
  }
  function render(visual) {
    if (!visual || visual.schemaVersion !== 1 || !Array.isArray(visual.metrics)) {
      status.textContent = 'A sourced text answer is available above; this visual report was not supplied.'; return;
    }
    report.replaceChildren();
    const title = document.createElement('h2');
    title.textContent = visual.view === 'comparison' ? 'District comparison'
      : visual.view === 'statewide' ? 'Statewide summary' : 'District finance';
    report.append(title);
    const metrics = metricRows(visual).filter(metric => metric && typeof metric === 'object');
    const bars = document.createElement('div'); bars.className = 'mcp-bars';
    const unitGroups = new Map();
    metrics.forEach(metric => {
      const unit = metric.unit || 'Unit not reported';
      if (!unitGroups.has(unit)) unitGroups.set(unit, []);
      unitGroups.get(unit).push(metric);
    });
    unitGroups.forEach((group, unit) => {
      const section = document.createElement('section'); section.className = 'mcp-bar-group';
      const heading = document.createElement('h3'); heading.textContent = unit; section.append(heading);
      const max = Math.max(1, ...group.map(metric => Number.isFinite(metric.value) ? Math.abs(metric.value) : 0));
      group.forEach(metric => {
        const item = document.createElement('div');
        const label = document.createElement('div'); label.className = 'mcp-bar-label';
        label.textContent = metric.label + ': ' + display(metric.value) + ' ' + (metric.unit || '');
        const track = document.createElement('div'); track.className = 'mcp-bar-track';
        track.setAttribute('role', 'img'); track.setAttribute('aria-label', label.textContent);
        const fill = document.createElement('div'); fill.className = 'mcp-bar';
        fill.style.width = (Number.isFinite(metric.value) ? Math.min(100, Math.abs(metric.value) / max * 100) : 0) + '%';
        track.append(fill); item.append(label, track); section.append(item);
      });
      bars.append(section);
    });
    report.append(bars);
    window.TxisdVisual.renderAccessibleTable(
      report, ['Measure', 'Value', 'Unit', 'Status'],
      metrics.map(metric => [metric.label, display(metric.value), metric.unit || 'Not reported', metric.status || 'unverified']),
      'Public finance figures'
    );
    metrics.forEach(metric => {
      const meta = document.createElement('div'); window.TxisdVisual.renderMetricMeta(meta, metric); report.append(meta);
    });
    const href = safeUrl(visual.websiteUrl); if (href) website.href = href;
    rendered = true; status.textContent = 'Public report data loaded.';
  }
  window.addEventListener('message', event => {
    if (event.source !== parent || !event.data || event.data.jsonrpc !== '2.0') return;
    const message = event.data;
    if (Number.isInteger(message.id) && pending.has(message.id)) {
      const job = pending.get(message.id); pending.delete(message.id); clearTimeout(job.timeout);
      if (message.error) job.reject(new Error(message.error.message || 'Host error')); else job.resolve(message.result);
      return;
    }
    if (message.method === 'ui/notifications/tool-result') {
      const content = message.params && message.params.structuredContent; render(content && content.visual);
    }
  });
  request('ui/initialize', {
    appInfo: { name: 'Texas ISD Finance Report', version: '1.0.0' }, appCapabilities: {}, protocolVersion: '2026-01-26',
  }).then(() => {
    notify('ui/notifications/initialized', {});
    if (!rendered) status.textContent = 'Ready for a public report.';
  }).catch(() => {
    if (!rendered) status.textContent = 'This visual report needs a compatible host. The public website remains available.';
  });
})();
  </script>
</body>
</html>
