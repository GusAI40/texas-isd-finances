# Vercel's FastAPI preset builds with `uv`, which requires a PEP 621 [project]
# table here. Without it every build dies on:
#   Failed to run "uv lock": No `project` table found in pyproject.toml
# These are the runtime dependencies only, deliberately excluding the
# pandas/plotting/Excel stack that offline scripts need and which would push
# the serverless function bundle toward Vercel's 500 MB cap.  The optional
# dependency groups below and this one committed lock cover every supported
# install path; requirements.txt remains a human-readable compatibility list.
[project]
name = "texas-isd-finances"
version = "1.0.0"
description = "Public transparency portal for Texas school district finances"
requires-python = ">=3.10,<3.13"
# Every entry carries an upper bound. Vercel resolves these at BUILD time, so
# without a ceiling a breaking major release upstream breaks a deploy with no
# change to this repo at all — and the failure surfaces as a build error on
# whatever commit happened to deploy next, which is the worst possible place
# to start debugging. Raise a bound deliberately, having read the changelog.
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "asyncpg>=0.29.0,<0.32.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "openai>=2.0.0,<4.0.0",
    "sqlglot>=30.17.0,<31.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

# Vercel installs only the base project above. These extras make every other
# supported build path use the same universal uv.lock without shipping the
# heavy offline stack in the serverless function bundle.
[project.optional-dependencies]
server = [
    "uvicorn[standard]>=0.30.0,<1.0.0",
]
offline = [
    "pandas>=2.0.0,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "xlrd>=2.0.1,<3.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "plotly>=5.18.0,<7.0.0",
    "pyshp>=2.3.0,<4.0.0",
    "Pillow>=10.0.0,<13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "ruff>=0.4.0",
]

[tool.uv]
# This is an application, not an installable library. Without this uv looks
# for a build backend and fails.
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
