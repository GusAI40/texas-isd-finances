# Vercel's FastAPI preset builds with `uv`, which requires a PEP 621 [project]
# table here. Without it every build dies on:
#   Failed to run "uv lock": No `project` table found in pyproject.toml
# These are the RUNTIME dependencies only — the same set as
# requirements-vercel.txt, deliberately excluding pandas/matplotlib/seaborn/
# plotly/openpyxl, which only the offline scripts in scripts/ need and which
# would push the function bundle toward Vercel's 500 MB cap.
# requirements.txt keeps the full local-development set.
[project]
name = "texas-isd-finances"
version = "1.0.0"
description = "Public transparency portal for Texas school district finances"
requires-python = ">=3.10"
# Every entry carries an upper bound. Vercel resolves these at BUILD time, so
# without a ceiling a breaking major release upstream breaks a deploy with no
# change to this repo at all — and the failure surfaces as a build error on
# whatever commit happened to deploy next, which is the worst possible place
# to start debugging. Raise a bound deliberately, having read the changelog.
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "asyncpg>=0.29.0,<0.32.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<0.5.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "openai>=2.0.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[tool.uv]
# This is an application, not an installable library. Without this uv looks
# for a build backend and fails.
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
