name: CI

# Every branch, not just master. Work happens on feature branches and used to
# reach a pull request with no CI having run on it at all.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      # The test suite parses these too, but it SKIPS when node is missing.
      # A skipped accessibility-critical check reads as a pass, so run it here
      # as its own step where an absent node is a hard failure. A const
      # redeclaration once killed static/map.html while it still served 200.
      - name: Parse the static page JavaScript
        run: python scripts/check_static_js.py

      - name: Run tests
        run: pytest -v
