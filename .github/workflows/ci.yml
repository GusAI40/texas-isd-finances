name: CI

# Every branch, not just master. Work happens on feature branches and used to
# reach a pull request with no CI having run on it at all.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          UV_PYTHON_DOWNLOADS: never
        run: |
          python -m pip install "uv==0.11.33"
          uv lock --check
          uv sync --locked --all-extras --group dev

      - name: Lint with ruff
        run: uv run --locked --no-sync ruff check .

      # The test suite parses these too, but it SKIPS when node is missing.
      # A skipped accessibility-critical check reads as a pass, so run it here
      # as its own step where an absent node is a hard failure. A const
      # redeclaration once killed static/map.html while it still served 200.
      - name: Parse the static page JavaScript
        run: uv run --locked --no-sync python scripts/check_static_js.py

      - name: Run tests
        run: uv run --locked --no-sync pytest -v
