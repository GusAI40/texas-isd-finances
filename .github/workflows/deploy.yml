name: Verify Vercel Git deployment (production)

# Production deploys through Vercel's existing Git integration when master
# moves. This workflow deliberately does not install a deployment CLI or hold
# deployment credentials: a second deploy path can race the Git integration,
# and the reviewed CLI graph carried avoidable transitive vulnerabilities.
#
# Instead, this is the gate after the real deploy. It waits for the public
# alias to serve this checkout and fails if the matching tree never arrives.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: verify-vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the revision Vercel must serve
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Wait for production to serve this tree
        run: |
          attempts=12
          for attempt in $(seq 1 "$attempts"); do
            echo "Production verification attempt $attempt/$attempts"
            if python3 scripts/verify_live.py \
                --require-network --expect-revision "$GITHUB_SHA"; then
              echo "### ✅ Production serves this Git revision with schema ready" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 30
            fi
          done
          echo "### ❌ Production revision or schema readiness was not verified" >> "$GITHUB_STEP_SUMMARY"
          exit 1
