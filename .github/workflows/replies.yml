# Daily reply ingest — the only conversion this product has.
#
# Every other stage of the funnel is behaviour a mail-security appliance can
# imitate: it opens the message, follows the link, loads the page. A REPLY is a
# person typing to a person. Nothing recorded it until this job existed, so the
# dashboard's last funnel stage read zero for everyone — worse than no funnel,
# because it looked measured.
#
# The script reads the inbox READ-ONLY, matches senders against the addresses
# we actually mailed, and records the FACT and the TIME. It never stores a
# subject or a body: what a superintendent writes to us is correspondence, not
# telemetry. Opt-outs are persisted directly to public.outreach_optout before
# the run can report success, and public logs contain counts only — never a
# recipient address or message content.
#
# Needs three repository secrets (Settings → Secrets → Actions):
#   IMAP_USER        the mailbox, gus@ubntag.com
#   IMAP_PASSWORD    a Gmail APP PASSWORD, not the account password
#                    (Google Account → Security → 2-Step Verification →
#                    App passwords). IMAP must also be enabled in Gmail.
#   SUPABASE_PAT     read the send log, write the reply events
# Until all three exist a manual run is a harmless readiness probe. A scheduled
# run fails after publishing a NOT CONFIGURED warning and summary, because an
# unobserved reply can contain a legally significant opt-out.
#
# Idempotent by design: it re-reads the same three weeks every day, and
# `event_key` makes the repeats no-ops. Without that, one reply would become
# twenty-one conversions and the funnel would invert.

name: Reply ingest

on:
  schedule:
    - cron: "0 13 * * *"      # daily 13:00 UTC (8:00 AM Central)
  workflow_dispatch:
    inputs:
      days:
        description: "How far back to read the inbox"
        default: "21"
      write:
        description: "Record the events (false = dry run)"
        default: "true"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Secret VALUES stay in step-local environment variables. This step
      # reports only the fixed variable NAMES that are absent.
      - name: Check reply-ingest readiness
        id: readiness
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: |
          missing=()
          [ -n "$IMAP_USER" ] || missing+=(IMAP_USER)
          [ -n "$IMAP_PASSWORD" ] || missing+=(IMAP_PASSWORD)
          [ -n "$SUPABASE_PAT" ] || missing+=(SUPABASE_PAT)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Reply ingest not configured::Missing repository secrets: ${missing[*]}. Execution was skipped; no mailbox or database call ran."
            {
              echo "### ⚠️ Reply ingest: NOT CONFIGURED"
              echo
              echo "Missing repository secret names: \`${missing[*]}\`."
              echo "No mailbox or database call ran. Add them in Settings → Secrets → Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "### ✅ Reply ingest: configured; execution eligible" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record replies from people we emailed
        if: steps.readiness.outputs.configured == 'true'
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          DAYS: ${{ github.event.inputs.days || '21' }}
          WRITE: ${{ github.event.inputs.write || 'true' }}
        run: |
          FLAG=""
          if [ "$WRITE" = "true" ]; then FLAG="--write"; fi
          python scripts/ingest_replies.py --days "$DAYS" $FLAG

      - name: Notify when scheduled reply ingest is unconfigured
        if: steps.readiness.outputs.configured != 'true' && github.event_name == 'schedule'
        run: |
          echo "Scheduled reply ingest cannot run until its repository secrets are configured." >&2
          exit 1
